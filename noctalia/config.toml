[bar.default]
capsule = true
end = [ "notifications", "clipboard", "bluetooth", "network", "volume", "input_volume", "battery" ]
margin_ends = 0
start = [ "workspaces" ]

[brightness]
minimum_brightness = 0.099999997764825821

[control_center]
width = 900

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
enabled = false

[hot_corners.top_left]
action = "launcher"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 683.0
    cy = 649.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[notification]
offset_x = 8

[shell]
avatar_path = "/home/giorgio/.face.icon"
polkit_agent = true

    [shell.launcher]
    categories = false

    [shell.panel]
    launcher_placement = "attached"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/giorgio/Wallpapers"
fill_mode = "fit"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/giorgio/Wallpapers/wallhaven-nevj8o_1366x768.png"

    [wallpaper.last]
    path = "/home/giorgio/Wallpapers/wallhaven-nevj8o_1366x768.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/giorgio/Wallpapers/wallhaven-nevj8o_1366x768.png"

[widget.battery]
enabled = true

[widget.workspaces]
display = "none"
