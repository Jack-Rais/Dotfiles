
[general]

#          ╭──────────────────────────────────────────────────────────╮
#          │                          Input                           │
#          ╰──────────────────────────────────────────────────────────╯

xkb_rules_layout = "it"
kb_layout = "it"
trackpad_natural_scrolling = 1


#          ╭──────────────────────────────────────────────────────────╮
#          │                        Animations                        │
#          ╰──────────────────────────────────────────────────────────╯

animations = 0
layer_animations = 0

#          ╭──────────────────────────────────────────────────────────╮
#          │                      Window Borders                      │
#          ╰──────────────────────────────────────────────────────────╯

border_px = 0
border_radius = 16
gap_inner_horizontal = 2
gap_inner_vertical = 2
gap_outer_horizontal = 4
gap_outer_vertical = 4

#          ╭──────────────────────────────────────────────────────────╮
#          │                          Cursor                          │
#          ╰──────────────────────────────────────────────────────────╯

cursor_size = 24
cursor_theme = "phinger-cursors-dark"

#          ╭──────────────────────────────────────────────────────────╮
#          │                         Layouts                          │
#          ╰──────────────────────────────────────────────────────────╯

dwindle_preserve_split = 1

[[rule.tag_rule]]
id = "*"
layout_name = "dwindle"
