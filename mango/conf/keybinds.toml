
[bind.default]

#          ╭──────────────────────────────────────────────────────────╮
#          │                         General                          │
#          ╰──────────────────────────────────────────────────────────╯

"SUPER+SHIFT+Return" = "quit"
"SUPER+SHIFT+R" = "reload_config"

#          ╭──────────────────────────────────────────────────────────╮
#          │                           Apps                           │
#          ╰──────────────────────────────────────────────────────────╯


"SUPER+Return" = "spawn,kitty -1"
"SUPER+B" = "spawn,zen-browser"

"SUPER+R" = "spawn,noctalia msg screenshot-region"
"SUPER+space" = "spawn,noctalia msg panel-toggle launcher"
"SUPER+S" = "spawn,noctalia msg panel-toggle control-center"
"SUPER+W" = "spawn,noctalia msg panel-toggle wallpaper"
"SUPER+comma" = "spawn,noctalia msg settings-toggle"
"SUPER+escape" = "spawn,noctalia msg panel-toggle session"

#          ╭──────────────────────────────────────────────────────────╮
#          │                      Window Actions                      │
#          ╰──────────────────────────────────────────────────────────╯

"SUPER+Q" = "killclient"
"SUPER+SHIFT+Q" = "killclient,force"

"SUPER+left" = "focusdir,left"
"SUPER+right" = "focusdir,right"
"SUPER+up" = "focusdir,up"
"SUPER+down" = "focusdir,down"

"SUPER+SHIFT+left" = "move_client,left"
"SUPER+SHIFT+right" = "move_client,right"
"SUPER+SHIFT+up" = "move_client,up"
"SUPER+SHIFT+down" = "move_client,down"

"SUPER+ALT+left" = "resizewin,-40,0"
"SUPER+ALT+right" = "resizewin,40,0"
"SUPER+ALT+up" = "resizewin,0,-40"
"SUPER+ALT+down" = "resizewin,0,40"

#          ╭──────────────────────────────────────────────────────────╮
#          │                       System Keys                        │
#          ╰──────────────────────────────────────────────────────────╯

"SUPER+SHIFT+S" = "spawn,systemctl suspend"

"XF86AudioRaiseVolume" = "spawn,noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn,noctalia msg volume-down"
"XF86AudioMute" = "spawn,noctalia msg volume-mute"
"XF86MonBrightnessUp" = "spawn,noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn,noctalia msg brightness-down"

[bind.default.lock]
"XF86AudioMicMute" = "spawn,noctalia msg mic-mute"
"XF86AudioNext" = "spawn,playerctl next"
"XF86AudioPause" = "spawn,playerctl play-pause"
"XF86AudioPlay" = "spawn,playerctl play-pause"
"XF86AudioPrev" = "spawn,playerctl previous"
