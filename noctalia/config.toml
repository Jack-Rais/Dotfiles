[audio]
enable_sounds = false

[bar.default]
capsule = true
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery" ]
margin_ends = 0
radius_bottom_left = 24
radius_bottom_right = 24
shadow = false
start = [ "workspaces" ]

[control_center]
width = 900

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen]
transition = []

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
history_retention_hours = 10

[shell]
polkit_agent = true

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false
    show_app_origin_indicator = false

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

[theme]
source = "wallpaper"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/giorgio/Wallpapers"
transition = []

    [wallpaper.default]
    path = "/home/giorgio/Wallpapers/wallhaven-y83p3x_1366x768.png"

    [wallpaper.last]
    path = "/home/giorgio/Wallpapers/wallhaven-y83p3x_1366x768.png"

[widget.workspaces]
show_labels = false
show_tooltip = false
