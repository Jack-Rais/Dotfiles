

#          ╭──────────────────────────────────────────────────────────╮
#          │                         General                          │
#          ╰──────────────────────────────────────────────────────────╯

bind=SUPER+SHIFT,Return,quit
bind=SUPER+SHIFT,R,reload_config


#          ╭──────────────────────────────────────────────────────────╮
#          │                           Apps                           │
#          ╰──────────────────────────────────────────────────────────╯

bind=SUPER,Return,spawn,kitty -1
bind=SUPER,B,spawn,zen-browser

bind=SUPER,R,spawn,noctalia msg screenshot-region
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,S,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,escape,spawn,noctalia msg panel-toggle session

#          ╭──────────────────────────────────────────────────────────╮
#          │                      Window Actions                      │
#          ╰──────────────────────────────────────────────────────────╯

bind=SUPER,Q,killclient
bind=SUPER+SHIFT,Q,killclient,force

bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

bind=SUPER+ALT,left,resizewin,-40,0
bind=SUPER+ALT,right,resizewin,40,0
bind=SUPER+ALT,up,resizewin,0,-40
bind=SUPER+ALT,down,resizewin,0,40

#          ╭──────────────────────────────────────────────────────────╮
#          │                        Workspaces                        │
#          ╰──────────────────────────────────────────────────────────╯

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,0

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,0

#          ╭──────────────────────────────────────────────────────────╮
#          │                       System Keys                        │
#          ╰──────────────────────────────────────────────────────────╯

bind=SUPER+SHIFT,S,spawn,systemctl suspend

bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
